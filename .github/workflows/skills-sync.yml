name: Sync Skills Catalog

on:
  push:
    branches: [main]
    paths:
      - "scripts/sync_skills.py"
      - "scripts/build_skills_from_research.py"
      - "scripts/validate_skills.py"
      - "docs/data/skills.schema.json"
      - "docs/data/skills.json"
      - ".github/workflows/skills-sync.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wiki
        uses: actions/checkout@v4

      - name: Fetch structured skill corpus
        run: |
          set -euo pipefail
          rm -rf /tmp/xv2-research
          for attempt in 1 2 3; do
            rm -rf /tmp/xv2-research
            if git clone --depth 1 --filter=blob:none --sparse https://github.com/Madreag/xenoverse_2_wiki.git /tmp/xv2-research; then
              cd /tmp/xv2-research
              git sparse-checkout set content/skills
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Unable to fetch structured skill corpus after 3 attempts" >&2
              exit 1
            fi
            sleep 5
          done
          cd - >/dev/null
          files="$(find /tmp/xv2-research/content/skills -name '*.md' | wc -l)"
          echo "Structured skill files: $files"
          test "$files" -gt 500

      - name: Build exhaustive structured skill catalog
        run: python scripts/build_skills_from_research.py

      - name: Validate canonical database
        run: python scripts/validate_skills.py

      - name: Create update PR when data changes
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Sync exhaustive Xenoverse 2 skill catalog"
          title: "Sync exhaustive Xenoverse 2 skill catalog"
          body: |
            Automated refresh of the Xenoverse 2 skill catalog.

            This refresh imports structured individual skill records as a research/cross-reference layer, retains curated records, preserves source provenance, and leaves records partially verified until independently confirmed.
          branch: automated/skills-catalog-sync
          delete-branch: true
          labels: database,automated,skills
