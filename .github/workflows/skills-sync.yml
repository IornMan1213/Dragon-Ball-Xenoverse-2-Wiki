name: Sync Skills Catalog

on:
  push:
    branches: [main]
    paths:
      - "scripts/sync_skills.py"
      - "scripts/build_skills_from_research.py"
      - "scripts/validate_skills.py"
      - "docs/data/skills.schema.json"
      - "docs/data/skills.json"
      - ".github/workflows/skills-sync.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download structured skill corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, json, pathlib, urllib.request
          root = pathlib.Path('/tmp/xv2-research/content/skills')
          root.mkdir(parents=True, exist_ok=True)
          headers = {'Accept': 'application/vnd.github+json', 'User-Agent': 'XV2-Wiki-Skill-Sync'}
          tree_url = 'https://api.github.com/repos/Madreag/xenoverse_2_wiki/git/trees/main?recursive=1'
          req = urllib.request.Request(tree_url, headers=headers)
          with urllib.request.urlopen(req, timeout=60) as r:
              tree = json.load(r)['tree']
          files = [x['path'] for x in tree if x.get('type') == 'blob' and x['path'].startswith('content/skills/') and x['path'].endswith('.md')]
          print(f'Found {len(files)} structured skill files')
          for path in files:
              url = 'https://api.github.com/repos/Madreag/xenoverse_2_wiki/contents/' + path + '?ref=main'
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=60) as r:
                  item = json.load(r)
              data = base64.b64decode(item['content'])
              dest = pathlib.Path('/tmp/xv2-research') / path
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(data)
          print(f'Downloaded {len(files)} skill files')
          PY

      - name: Build exhaustive structured skill catalog
        run: python scripts/build_skills_from_research.py

      - name: Validate canonical database
        run: python scripts/validate_skills.py

      - name: Create update PR when data changes
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Sync exhaustive Xenoverse 2 skill catalog"
          title: "Sync exhaustive Xenoverse 2 skill catalog"
          body: |
            Automated refresh of the Xenoverse 2 skill catalog.

            This refresh imports structured individual skill records as a research/cross-reference layer, retains curated records, preserves source provenance, and leaves records partially verified until independently confirmed.
          branch: automated/skills-catalog-sync
          delete-branch: true
          labels: database,automated,skills
