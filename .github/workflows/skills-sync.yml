name: Sync Skills Catalog

on:
  push:
    branches: [main]
    paths:
      - "scripts/sync_skills.py"
      - "scripts/build_skills_from_research.py"
      - "scripts/apply_awoken_overrides.py"
      - "scripts/normalize_awoken_transformation_category.py"
      - "scripts/validate_skills.py"
      - "scripts/validate_pq_skill_links.py"
      - "scripts/validate_awoken_integrity.py"
      - "scripts/validate_awoken_model.py"
      - "docs/data/skills.schema.json"
      - "docs/data/skill-research-batches/**"
      - "docs/data/parallel-quest-research-batches/**"
      - "docs/data/awoken-research-batches/**"
      - "docs/data/awoken-canonical-overrides.json"
      - ".github/workflows/skills-sync.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: skills-catalog-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout wiki
        uses: actions/checkout@v4
      - name: Fetch structured skill corpus
        run: |
          set -euo pipefail
          rm -rf /tmp/xv2-research
          git clone --depth 1 --filter=blob:none --sparse https://github.com/Madreag/xenoverse_2_wiki.git /tmp/xv2-research
          git -C /tmp/xv2-research sparse-checkout set content/skills
          files="$(find /tmp/xv2-research/content/skills -type f -name '*.md' | wc -l)"
          echo "Structured skill files fetched: $files"
          if [ "$files" -lt 500 ]; then echo "ERROR: expected at least 500 structured skill files; refusing to build a partial catalog."; exit 1; fi
      - name: Build exhaustive structured skill catalog
        run: python scripts/build_skills_from_research.py
      - name: Apply researched Awoken canonical overrides
        run: python scripts/apply_awoken_overrides.py
      - name: Normalize Awoken transformation model
        run: python scripts/normalize_awoken_transformation_category.py
      - name: Validate canonical database
        run: python scripts/validate_skills.py
      - name: Validate Parallel Quest skill cross-links
        run: python scripts/validate_pq_skill_links.py
      - name: Validate promoted Awoken integrity
        run: python scripts/validate_awoken_integrity.py
      - name: Validate Awoken parent-stage model
        run: python scripts/validate_awoken_model.py
      - name: Show generated data summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('docs/data/skills.json').read_text(encoding='utf-8'))
          print(f"Canonical records: {data.get('record_count',0)}")
          print(f"Generated: {data.get('generated')}")
          print(f"Status: {data.get('status')}")
          PY
      - name: Create update PR when data changes
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Sync exhaustive Xenoverse 2 skill catalog"
          title: "Sync exhaustive Xenoverse 2 skill catalog"
          body: |
            Automated refresh of the Xenoverse 2 skill catalog.

            The sync imports structured skill research, applies curated repository corrections and Awoken overrides, normalizes the Awoken parent/stage model, validates the canonical catalog, and verifies Parallel Quest skill cross-links before proposing changes.
          branch: automated/skills-catalog-sync
          delete-branch: true
          labels: database,automated,skills
