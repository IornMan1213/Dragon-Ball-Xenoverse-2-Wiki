name: Sync Skills Catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync Fandom skill categories
        run: python scripts/sync_skills.py

      - name: Validate canonical database
        run: python scripts/validate_skills.py

      - name: Create update PR when data changes
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Sync Xenoverse 2 skill catalog"
          title: "Sync Xenoverse 2 skill catalog"
          body: |
            Automated refresh of the skills catalog from the configured Fandom category sources.

            The sync updates category membership/index data only. Mechanics, costs, unlock methods and meta claims remain separate verification work.
          branch: automated/skills-catalog-sync
          delete-branch: true
          labels: database,automated
