name: Sync Skills Catalog

on:
  push:
    branches: [main]
    paths:
      - "scripts/sync_skills.py"
      - "scripts/build_skills_from_research.py"
      - "scripts/validate_skills.py"
      - "docs/data/skills.schema.json"
      - "docs/data/skills.json"
      - ".github/workflows/skills-sync.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wiki
        uses: actions/checkout@v4

      - name: Fetch structured skill corpus from GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/xv2-research
          mkdir -p /tmp/xv2-research/content/skills
          : > /tmp/xv2-fetch-errors.log
          page=1
          total=0
          while :; do
            api="https://api.github.com/repos/Madreag/xenoverse_2_wiki/contents/content/skills?ref=main&per_page=100&page=${page}"
            json_file="/tmp/xv2-page-${page}.json"
            curl -fsSL --retry 3 --retry-delay 2 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "$api" > "$json_file"
            count="$(python - "$json_file" <<'PY'
import json, sys
with open(sys.argv[1], encoding='utf-8') as f:
    data=json.load(f)
print(len(data) if isinstance(data, list) else 0)
PY
)"
            [ "$count" -gt 0 ] || break
            while IFS=$'\t' read -r name download_url; do
              [ -n "$name" ] || continue
              out="/tmp/xv2-research/content/skills/$name"
              if ! curl -fsSL --retry 3 --retry-delay 2 \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                "$download_url" > "$out"; then
                echo "$name" >> /tmp/xv2-fetch-errors.log
                rm -f "$out"
              fi
            done < <(python - "$json_file" <<'PY'
import json, sys
with open(sys.argv[1], encoding='utf-8') as f:
    data=json.load(f)
for item in data:
    if item.get('type') == 'file' and item.get('name','').endswith('.md') and item.get('download_url'):
        print(item['name'] + '\t' + item['download_url'])
PY
)
            total=$((total + count))
            [ "$count" -lt 100 ] && break
            page=$((page + 1))
          done
          files="$(find /tmp/xv2-research/content/skills -name '*.md' | wc -l)"
          errors="$(wc -l < /tmp/xv2-fetch-errors.log)"
          echo "GitHub API entries: $total"
          echo "Structured skill files: $files"
          echo "Fetch errors: $errors"
          test "$files" -gt 500

      - name: Build exhaustive structured skill catalog
        run: python scripts/build_skills_from_research.py

      - name: Validate canonical database
        run: python scripts/validate_skills.py

      - name: Create update PR when data changes
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Sync exhaustive Xenoverse 2 skill catalog"
          title: "Sync exhaustive Xenoverse 2 skill catalog"
          body: |
            Automated refresh of the Xenoverse 2 skill catalog.

            This refresh imports structured individual skill records as a research/cross-reference layer, retains curated records, preserves source provenance, and leaves records partially verified until independently confirmed.
          branch: automated/skills-catalog-sync
          delete-branch: true
          labels: database,automated,skills
