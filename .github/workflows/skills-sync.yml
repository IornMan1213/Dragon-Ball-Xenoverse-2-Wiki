name: Sync Skills Catalog

on:
  push:
    branches: [main]
    paths:
      - "scripts/sync_skills.py"
      - "scripts/build_skills_from_research.py"
      - "scripts/validate_skills.py"
      - "docs/data/skills.schema.json"
      - "docs/data/skills.json"
      - ".github/workflows/skills-sync.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download structured skill corpus from GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/xv2-research
          mkdir -p /tmp/xv2-research/content/skills
          page=1
          total=0
          while :; do
            api="https://api.github.com/repos/Madreag/xenoverse_2_wiki/contents/content/skills?ref=main&per_page=100&page=${page}"
            json="$(curl -fsSL --retry 3 --retry-delay 2 -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" "$api")"
            count="$(python -c 'import json,sys; d=json.load(sys.stdin); print(len(d))' <<< "$json")"
            [ "$count" -gt 0 ] || break
            python - "$json" "/tmp/xv2-page-${page}.json" <<'PY'
import json, sys
items=json.loads(sys.argv[1])
with open(sys.argv[2], 'w', encoding='utf-8') as f:
    json.dump(items, f)
PY
            python - "/tmp/xv2-page-${page}.json" <<'PY'
import json, sys, urllib.request, os
items=json.load(open(sys.argv[1], encoding='utf-8'))
out='/tmp/xv2-research/content/skills'
os.makedirs(out, exist_ok=True)
for item in items:
    if item.get('type') != 'file' or not item.get('name','').endswith('.md'):
        continue
    url=item.get('download_url')
    if not url:
        continue
    req=urllib.request.Request(url, headers={'User-Agent':'xv2-wiki-skill-sync'})
    with urllib.request.urlopen(req, timeout=30) as r:
        data=r.read()
    with open(os.path.join(out,item['name']), 'wb') as f:
        f.write(data)
PY
            total=$((total + count))
            [ "$count" -lt 100 ] && break
            page=$((page + 1))
          done
          files="$(find /tmp/xv2-research/content/skills -name '*.md' | wc -l)"
          echo "GitHub API entries: $total"
          echo "Structured skill files: $files"
          test "$files" -gt 500

      - name: Build exhaustive structured skill catalog
        run: python scripts/build_skills_from_research.py

      - name: Validate canonical database
        run: python scripts/validate_skills.py

      - name: Create update PR when data changes
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Sync exhaustive Xenoverse 2 skill catalog"
          title: "Sync exhaustive Xenoverse 2 skill catalog"
          body: |
            Automated refresh of the Xenoverse 2 skill catalog.

            This refresh imports structured individual skill records as a research/cross-reference layer, retains curated records, preserves source provenance, and leaves records partially verified until independently confirmed.
          branch: automated/skills-catalog-sync
          delete-branch: true
          labels: database,automated,skills
