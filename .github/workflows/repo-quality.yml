name: Repository quality

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - '**/*.json'
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.py'
      - 'scripts/check_repo_artifacts.py'
      - '.github/workflows/repo-quality.yml'

permissions:
  contents: read

jobs:
  artifact-check:
    name: Check for internal artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Scan repository text
        run: python3 scripts/check_repo_artifacts.py
