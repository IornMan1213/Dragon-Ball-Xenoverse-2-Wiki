name: Repository quality

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.markdown'
      - '**/*.html'
      - '**/*.htm'
      - '**/*.css'
      - '**/*.scss'
      - '**/*.js'
      - '**/*.ts'
      - '**/*.json'
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.txt'
      - '**/*.py'
      - '**/*.sh'
      - '**/*.bat'
      - '**/*.xml'
      - '**/*.csv'
      - 'scripts/check_repo_artifacts.py'
      - 'scripts/strip_internal_artifacts.py'
      - '.github/workflows/repo-quality.yml'
      - '.github/workflows/cleanup-internal-artifacts.yml'

permissions:
  contents: read

jobs:
  artifact-check:
    name: Check for internal artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Scan repository text
        run: |
          set +e
          python3 scripts/check_repo_artifacts.py 2>&1 | tee artifact-check-report.txt
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Upload artifact-check diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-quality-artifact-check
          path: artifact-check-report.txt
