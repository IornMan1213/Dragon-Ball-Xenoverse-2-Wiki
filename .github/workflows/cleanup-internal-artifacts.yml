name: Clean internal artifacts

# Keep main clean after every push; commits made with GITHUB_TOKEN do not recursively trigger workflows.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cleanup-internal-artifacts
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Strip internal artifacts
        run: python3 scripts/strip_internal_artifacts.py

      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo "No internal artifacts found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove internal citation artifacts [skip ci]"
          git push
