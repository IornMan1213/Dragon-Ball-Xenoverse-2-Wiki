name: Clean internal artifacts

# Keep main clean after every push; cleanup commits are marked to avoid a recursive push run.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cleanup-internal-artifacts
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Strip internal artifacts
        run: python3 scripts/strip_internal_artifacts.py

      - name: Verify artifact-free tree
        run: python3 scripts/check_repo_artifacts.py

      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo "No internal artifacts found."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove internal citation artifacts [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
