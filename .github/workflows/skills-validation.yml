name: Skills schema validation
# Dedicated CI gate for the canonical skills schema and validator.

on:
  push:
    branches: [main]
    paths:
      - 'docs/data/skills.json'
      - 'docs/data/skills-index.json'
      - 'docs/data/skills.schema.json'
      - 'scripts/validate_skills.py'
      - '.github/workflows/skills-validation.yml'
  pull_request:
    paths:
      - 'docs/data/skills.json'
      - 'docs/data/skills-index.json'
      - 'docs/data/skills.schema.json'
      - 'scripts/validate_skills.py'
      - '.github/workflows/skills-validation.yml'

permissions:
  contents: read

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.25.1'
      - name: Validate skills dataset
        run: python scripts/validate_skills.py
