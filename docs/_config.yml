title: Dragon Ball Xenoverse 2 Wiki
description: A community-built Dragon Ball Xenoverse 2 reference hub for guides, builds, unlocks, quests, farming, skills, and more.
url: https://iornman1213.github.io
baseurl: /Dragon-Ball-Xenoverse-2-Wiki
markdown: kramdown
permalink: pretty
kramdown:
  input: GFM
  hard_wrap: false
exclude:
  - data
  - audit-latest.json
  - '*.json'
  - assets/README.md
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: wiki
